<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Courses — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #050508; color: #e2e8f0; min-height: 100vh; }
        .bg-glow { position: fixed; top: 0; left: 0; right: 0; height: 100vh; z-index: -1;
                   background: radial-gradient(circle at 10% 20%, rgba(99,102,241,0.1) 0%, transparent 40%),
                               radial-gradient(circle at 90% 80%, rgba(167,139,250,0.1) 0%, transparent 40%); }
        nav { display: flex; justify-content: space-between; align-items: center;
              padding: 1.25rem 4rem; background: rgba(15,15,20,0.7); backdrop-filter: blur(12px);
              border-bottom: 1px solid rgba(255,255,255,0.06); position: sticky; top: 0; z-index: 100; }
        nav .brand { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; color: #818cf8; }
        .container { max-width: 1200px; margin: 0 auto; padding: 4rem; }
        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 2rem; letter-spacing: -0.02em; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
                border-radius: 1.5rem; padding: 2rem; overflow: hidden; backdrop-filter: blur(12px); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 1.25rem; color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.08); }
        td { padding: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 1rem; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 700; background: rgba(255,255,255,0.1); color: #94a3b8; }
        .badge-success { background: rgba(16,185,129,0.1); color: #10b981; }
        .btn-action { background: rgba(99,102,241,0.1); color: #818cf8; border: none; padding: 0.5rem 1rem; border-radius: 0.75rem; cursor: pointer; font-weight: 600; text-decoration: none; margin-right: 0.5rem; }
        .btn-danger { background: rgba(239,68,68,0.1); color: #ef4444; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <nav>
        <span class="brand">Admin Portal</span>
        <div class="nav-links">
            <a th:href="@{/admin/dashboard}" style="color: #94a3b8; text-decoration: none; margin-left: 2rem;">Dashboard</a>
            <a th:href="@{/admin/courses}" style="color: #fff; text-decoration: none; margin-left: 2rem;">Courses</a>
            <a th:href="@{/admin/users}" style="color: #94a3b8; text-decoration: none; margin-left: 2rem;">Users</a>
        </div>
    </nav>
    <div class="container">
        <h1>Course Management</h1>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${courses}">
                        <td th:text="${course.title}">Course Title</td>
                        <td th:text="${course.category}">Category</td>
                        <td th:text="${'$' + course.price}">$0.00</td>
                        <td>
                            <span class="badge" th:classappend="${course.isPublished ? 'badge-success' : ''}" 
                                  th:text="${course.isPublished ? 'Published' : 'Draft'}">Status</span>
                        </td>
                        <td>
                            <form th:if="${!course.isPublished}" th:action="@{/admin/courses/{id}/approve(id=${course.courseId})}" method="post" style="display:inline;">
                                <button type="submit" class="btn-action">Approve</button>
                            </form>
                            <button class="btn-action btn-danger">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
