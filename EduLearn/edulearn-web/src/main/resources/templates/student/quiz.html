<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${quiz != null ? quiz.title + ' — EduLearn Quiz' : 'Quiz — EduLearn'}">Quiz — EduLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#0f0f14;color:#e2e8f0;min-height:100vh}
        nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;
            background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08)}
        nav .brand{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a78bfa);
                   -webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .container{max-width:760px;margin:3rem auto;padding:0 2rem}
        h1{font-size:1.75rem;font-weight:700;margin-bottom:0.5rem}
        .quiz-meta{color:#94a3b8;font-size:0.9rem;margin-bottom:2rem}
        .timer-bar{display:flex;align-items:center;gap:1rem;background:rgba(99,102,241,0.1);
                   border:1px solid rgba(99,102,241,0.3);border-radius:0.75rem;
                   padding:0.75rem 1rem;margin-bottom:2rem}
        #timer{font-size:1.2rem;font-weight:700;color:#a78bfa}
        .question-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
                       border-radius:1rem;padding:1.5rem;margin-bottom:1.5rem}
        .question-card h3{font-size:1rem;font-weight:600;margin-bottom:1rem}
        .option{display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0.75rem;
                border-radius:0.5rem;cursor:pointer;transition:background .2s;margin-bottom:0.5rem}
        .option:hover{background:rgba(255,255,255,0.06)}
        .option input[type=radio]{accent-color:#a78bfa}
        .btn{display:block;width:100%;padding:0.9rem;border-radius:0.75rem;font-weight:600;
             border:none;background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;
             cursor:pointer;font-size:1rem;margin-top:2rem}
        .btn:hover{opacity:0.9}
        .alert{padding:0.75rem 1rem;border-radius:0.5rem;margin-bottom:1rem;
               background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#fca5a5}
    </style>
</head>
<body>
<nav>
    <span class="brand">EduLearn</span>
</nav>
<div class="container">
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <div th:if="${quiz != null}">
        <h1 th:text="${quiz.title}">Quiz Title</h1>
        <p class="quiz-meta"
           th:text="${quiz.totalQuestions} + ' questions · ' + (${quiz.timeLimitMinutes} ?: 'No') + ' min limit'">
            10 questions · 30 min limit
        </p>
        <div class="timer-bar" th:if="${quiz.timeLimitMinutes != null}">
            ⏱ Time Remaining: <span id="timer" th:attr="data-minutes=${quiz.timeLimitMinutes}">--:--</span>
        </div>
        <form th:action="@{/student/quizzes/{id}/submit(id=${quiz.id})}" method="post">
            <div class="question-card" th:each="q,qStat : ${quiz.questions}">
                <h3 th:text="${qStat.count + '. ' + q.text}">Question</h3>
                <div class="option" th:each="opt : ${q.options}">
                    <input type="radio" th:name="'answers[' + ${q.id} + ']'" th:value="${opt.id}"/>
                    <label th:text="${opt.text}">Option text</label>
                </div>
            </div>
            <button type="submit" class="btn">Submit Quiz</button>
        </form>
    </div>
</div>
<script>
    const timerEl = document.getElementById('timer');
    if (timerEl) {
        let secs = parseInt(timerEl.dataset.minutes) * 60;
        const interval = setInterval(() => {
            if (secs <= 0) { clearInterval(interval); timerEl.closest('form').submit(); return; }
            secs--;
            const m = String(Math.floor(secs / 60)).padStart(2,'0');
            const s = String(secs % 60).padStart(2,'0');
            timerEl.textContent = m + ':' + s;
        }, 1000);
    }
</script>
</body>
</html>
