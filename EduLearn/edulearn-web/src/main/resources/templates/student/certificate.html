<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Certificate — EduLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#0f0f14;color:#e2e8f0;
             min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .cert-card{background:linear-gradient(135deg,#1e1b4b,#312e81);
                   border:2px solid rgba(167,139,250,0.4);border-radius:1.5rem;
                   padding:3rem 4rem;text-align:center;max-width:700px;width:90%;
                   box-shadow:0 0 60px rgba(99,102,241,0.25)}
        .cert-logo{font-size:1.8rem;font-weight:700;
                   background:linear-gradient(135deg,#6366f1,#a78bfa);
                   -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.5rem}
        .cert-subtitle{color:#a78bfa;font-size:0.9rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:2rem}
        .cert-body{font-size:1.1rem;color:#c7d2fe;margin-bottom:1rem}
        .cert-name{font-size:2.5rem;font-weight:700;color:#fff;margin:1rem 0}
        .cert-course{font-size:1.3rem;font-weight:600;color:#a78bfa;margin-bottom:2rem}
        .cert-uuid{font-size:0.75rem;color:#6366f1;letter-spacing:1px;margin-top:2rem}
        .btn{display:inline-block;margin-top:2rem;padding:0.75rem 2rem;border-radius:0.75rem;
             font-weight:600;text-decoration:none;
             background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:0.95rem;
             transition:opacity .2s}
        .btn:hover{opacity:0.9}
    </style>
</head>
<body>
<div class="cert-card">
    <div class="cert-logo">EduLearn</div>
    <div class="cert-subtitle">Certificate of Completion</div>
    <p class="cert-body">This is to certify that</p>
    <div class="cert-name" th:text="${studentName ?: 'Student Name'}">Student Name</div>
    <p class="cert-body">has successfully completed the course</p>
    <div class="cert-course" th:text="${courseName ?: 'Course Name'}">Course Name</div>
    <p style="color:#94a3b8;font-size:0.9rem"
       th:text="'Completed on ' + (${completionDate} ?: 'N/A')">Completed on N/A</p>
    <div class="cert-uuid" th:text="'Verification ID: ' + (${verificationCode} ?: 'N/A')">
        Verification ID: N/A
    </div>
    <a th:href="@{/student/certificates/{id}(id=${courseId})}" class="btn">⬇ Download PDF</a>
</div>
</body>
</html>
