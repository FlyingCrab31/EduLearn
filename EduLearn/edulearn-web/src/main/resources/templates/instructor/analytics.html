<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Course Analytics — EduLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#0f0f14;color:#e2e8f0;min-height:100vh}
        nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;
            background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08)}
        nav .brand{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a78bfa);
                   -webkit-background-clip:text;-webkit-text-fill-color:transparent}
        nav a{color:#94a3b8;text-decoration:none;margin-left:1.5rem;font-size:0.9rem}
        .container{max-width:1000px;margin:3rem auto;padding:0 2rem}
        h1{font-size:1.75rem;font-weight:700;margin-bottom:2rem}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2.5rem}
        .stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
                   border-radius:1rem;padding:1.5rem;text-align:center}
        .stat-card .num{font-size:2rem;font-weight:700;color:#a78bfa}
        .stat-card .label{font-size:0.85rem;color:#94a3b8;margin-top:0.25rem}
        .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
              border-radius:1rem;padding:1.5rem;margin-bottom:1.5rem}
        .card h2{font-size:1.1rem;font-weight:700;margin-bottom:1rem}
        .alert{padding:0.75rem 1rem;border-radius:0.5rem;margin-bottom:1rem;
               background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#fca5a5}
        table{width:100%;border-collapse:collapse}
        th,td{padding:0.75rem;text-align:left;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.9rem}
        th{color:#94a3b8;font-weight:600}
    </style>
</head>
<body>
<nav>
    <span class="brand">EduLearn Instructor</span>
    <div>
        <a th:href="@{/instructor/dashboard}">Dashboard</a>
    </div>
</nav>
<div class="container">
    <h1>Course Analytics</h1>
    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="num" th:text="${enrollStats?.totalEnrollments ?: 0}">0</div>
            <div class="label">Total Enrollments</div>
        </div>
        <div class="stat-card">
            <div class="num" th:text="${completionStats?.completionRate ?: '0%'}">0%</div>
            <div class="label">Completion Rate</div>
        </div>
        <div class="stat-card">
            <div class="num" th:text="${enrollStats?.activeStudents ?: 0}">0</div>
            <div class="label">Active Students</div>
        </div>
        <div class="stat-card">
            <div class="num" th:text="${completionStats?.certificatesIssued ?: 0}">0</div>
            <div class="label">Certificates Issued</div>
        </div>
    </div>

    <div class="card" th:if="${completionStats?.lessonStats != null}">
        <h2>Per-Lesson Completion</h2>
        <table>
            <thead><tr><th>Lesson</th><th>Views</th><th>Completion %</th></tr></thead>
            <tbody>
            <tr th:each="ls : ${completionStats.lessonStats}">
                <td th:text="${ls.lessonTitle}">Lesson</td>
                <td th:text="${ls.views ?: 0}">0</td>
                <td th:text="${ls.completionPct ?: 0} + '%'">0%</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
