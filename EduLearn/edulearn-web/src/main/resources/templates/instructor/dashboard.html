<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Instructor Dashboard — EduLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#0f0f14;color:#e2e8f0;min-height:100vh}
        nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;
            background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08)}
        nav .brand{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a78bfa);
                   -webkit-background-clip:text;-webkit-text-fill-color:transparent}
        nav a{color:#94a3b8;text-decoration:none;margin-left:1.5rem;font-size:0.9rem}
        .container{max-width:1200px;margin:3rem auto;padding:0 2rem}
        h1{font-size:1.75rem;font-weight:700;margin-bottom:2rem}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2.5rem}
        .stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
                   border-radius:1rem;padding:1.5rem;text-align:center}
        .stat-card .num{font-size:2rem;font-weight:700;color:#a78bfa}
        .stat-card .label{font-size:0.85rem;color:#94a3b8;margin-top:0.25rem}
        .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
        .btn{display:inline-block;padding:0.6rem 1.4rem;border-radius:0.75rem;font-weight:600;
             text-decoration:none;border:none;cursor:pointer;
             background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:0.9rem}
        .course-table{width:100%;border-collapse:collapse}
        .course-table th,.course-table td{padding:0.85rem 1rem;text-align:left;
                                          border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.9rem}
        .course-table th{color:#94a3b8;font-weight:600}
        .course-table tr:hover td{background:rgba(255,255,255,0.02)}
        .badge{display:inline-block;padding:0.2rem 0.6rem;border-radius:999px;font-size:0.75rem;font-weight:600}
        .badge-published{background:rgba(34,197,94,0.15);color:#86efac}
        .badge-draft{background:rgba(234,179,8,0.15);color:#fde68a}
        .badge-pending{background:rgba(99,102,241,0.15);color:#a5b4fc}
        .alert{padding:0.75rem 1rem;border-radius:0.5rem;margin-bottom:1rem;
               background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#fca5a5}
    </style>
</head>
<body>
<nav>
    <span class="brand">EduLearn Instructor</span>
    <div>
        <a th:href="@{/instructor/dashboard}">Dashboard</a>
        <a th:href="@{/instructor/courses/create}">New Course</a>
        <a th:href="@{/student/home}">Student View</a>
    </div>
</nav>
<div class="container">
    <h1>Instructor Dashboard</h1>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <div class="stats-grid">
        <div class="stat-card">
            <div class="num" th:text="${enrollStats?.totalEnrollments ?: 0}">0</div>
            <div class="label">Total Enrollments</div>
        </div>
        <div class="stat-card">
            <div class="num" th:text="${courses?.size() ?: 0}">0</div>
            <div class="label">My Courses</div>
        </div>
        <div class="stat-card">
            <div class="num" th:text="${enrollStats?.completionRate ?: '0%'}">0%</div>
            <div class="label">Avg Completion Rate</div>
        </div>
        <div class="stat-card">
            <div class="num" th:text="${enrollStats?.avgRating ?: 'N/A'}">N/A</div>
            <div class="label">Avg Rating</div>
        </div>
    </div>
    <div class="section-header">
        <h2 style="font-size:1.2rem;font-weight:700">My Courses</h2>
        <a th:href="@{/instructor/courses/create}" class="btn">+ New Course</a>
    </div>
    <table class="course-table">
        <thead><tr>
            <th>Title</th><th>Status</th><th>Enrollments</th><th>Actions</th>
        </tr></thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.title}">Course Title</td>
            <td>
                <span class="badge"
                      th:classappend="${course.status == 'PUBLISHED' ? 'badge-published' : (course.status == 'DRAFT' ? 'badge-draft' : 'badge-pending')}"
                      th:text="${course.status}">DRAFT</span>
            </td>
            <td th:text="${course.enrollmentCount ?: 0}">0</td>
            <td>
                <a th:href="@{/instructor/courses/{id}/edit(id=${course.id})}" style="color:#a78bfa;text-decoration:none;font-size:0.85rem">Edit</a>
                &nbsp;|&nbsp;
                <a th:href="@{/instructor/courses/{id}/analytics(id=${course.id})}" style="color:#a78bfa;text-decoration:none;font-size:0.85rem">Analytics</a>
                &nbsp;|&nbsp;
                <form method="post" th:action="@{/instructor/courses/{id}/publish(id=${course.id})}"
                      style="display:inline" th:if="${course.status != 'PUBLISHED'}">
                    <button type="submit" style="background:none;border:none;color:#a78bfa;cursor:pointer;font-size:0.85rem">Publish</button>
                </form>
            </td>
        </tr>
        <tr th:unless="${courses != null and !#lists.isEmpty(courses)}">
            <td colspan="4" style="color:#64748b;text-align:center;padding:2rem">No courses yet. Create your first one!</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
