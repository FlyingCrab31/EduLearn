<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Course — EduLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#0f0f14;color:#e2e8f0;min-height:100vh}
        nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;
            background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(255,255,255,0.08)}
        nav .brand{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a78bfa);
                   -webkit-background-clip:text;-webkit-text-fill-color:transparent}
        nav a{color:#94a3b8;text-decoration:none;margin-left:1.5rem;font-size:0.9rem}
        .container{max-width:700px;margin:3rem auto;padding:0 2rem}
        h1{font-size:1.75rem;font-weight:700;margin-bottom:2rem}
        .form-group{margin-bottom:1.25rem}
        label{display:block;font-size:0.85rem;font-weight:600;color:#94a3b8;margin-bottom:0.4rem}
        input,select,textarea{width:100%;padding:0.75rem 1rem;background:rgba(255,255,255,0.06);
                               border:1px solid rgba(255,255,255,0.1);border-radius:0.75rem;
                               color:#e2e8f0;font-size:0.95rem;font-family:inherit}
        input::placeholder,textarea::placeholder{color:#64748b}
        textarea{resize:vertical;min-height:100px}
        select option{background:#1e1b4b}
        .btn{display:block;width:100%;padding:0.9rem;border-radius:0.75rem;font-weight:600;
             border:none;background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;
             cursor:pointer;font-size:1rem;margin-top:1.5rem}
        .btn:hover{opacity:0.9}
        .alert{padding:0.75rem 1rem;border-radius:0.5rem;margin-bottom:1rem;
               background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#fca5a5}
    </style>
</head>
<body>
<nav>
    <span class="brand">EduLearn Instructor</span>
    <div>
        <a th:href="@{/instructor/dashboard}">Dashboard</a>
    </div>
</nav>
<div class="container">
    <h1>Create New Course</h1>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <form method="post" th:action="@{/instructor/courses/create}">
        <div class="form-group">
            <label for="title">Course Title *</label>
            <input id="title" type="text" name="title" placeholder="e.g. Complete Java Spring Boot Course" required/>
        </div>
        <div class="form-group">
            <label for="description">Description *</label>
            <textarea id="description" name="description" placeholder="Describe what students will learn…" required></textarea>
        </div>
        <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
                <option value="">Select category…</option>
                <option value="Programming">Programming</option>
                <option value="Data Science">Data Science</option>
                <option value="Design">Design</option>
                <option value="Business">Business</option>
                <option value="Marketing">Marketing</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="level">Level *</label>
            <select id="level" name="level" required>
                <option value="BEGINNER">Beginner</option>
                <option value="INTERMEDIATE">Intermediate</option>
                <option value="ADVANCED">Advanced</option>
            </select>
        </div>
        <div class="form-group">
            <label for="price">Price (USD) — leave 0 for free</label>
            <input id="price" type="number" name="price" min="0" step="0.01" value="0"/>
        </div>
        <div class="form-group">
            <label for="thumbnailUrl">Thumbnail Image URL</label>
            <input id="thumbnailUrl" type="url" name="thumbnailUrl" placeholder="https://…"/>
        </div>
        <button type="submit" class="btn">Create Course</button>
    </form>
</div>
</body>
</html>
