server.port=8090
spring.application.name=edulearn-web

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Spring Security — disable CSRF only for API calls; keep enabled for form flows
# (override per-route in SecurityConfig)
spring.security.user.name=admin
spring.security.user.password=admin

# Downstream microservice base URLs (resolved via Eureka / load-balancer)
app.services.auth-url=http://auth-service
app.services.course-url=http://course-service
app.services.lesson-url=http://lesson-service
app.services.enrollment-url=http://enrollment-service
app.services.assessment-url=http://assessment-service
app.services.payment-url=http://payment-service
app.services.progress-url=http://progress-service
app.services.discussion-url=http://discussion-service
app.services.notification-url=http://notification-service

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging
logging.level.com.edulearn.web=DEBUG
