spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Global CORS Configuration (Now handled in GatewaySecurityConfig.java)
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
# spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization
# spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.preserve-host-header=true

# De-duplicate CORS headers (Handled in GatewaySecurityConfig if needed)
# spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST




spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**, /api/v1/users/**

spring.cloud.gateway.routes[1].id=course-service
spring.cloud.gateway.routes[1].uri=lb://course-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/courses/**

spring.cloud.gateway.routes[2].id=lesson-service
spring.cloud.gateway.routes[2].uri=lb://lesson-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/lessons/**, /api/v1/preview/**

spring.cloud.gateway.routes[3].id=enrollment-service
spring.cloud.gateway.routes[3].uri=lb://enrollment-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/enrollments/**

spring.cloud.gateway.routes[4].id=assessment-service
spring.cloud.gateway.routes[4].uri=lb://assessment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/quizzes/**, /api/v1/attempts/**

spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/payments/**, /api/v1/subscriptions/**

spring.cloud.gateway.routes[6].id=discussion-service
spring.cloud.gateway.routes[6].uri=lb://discussion-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/discussions/**

spring.cloud.gateway.routes[7].id=progress-service
spring.cloud.gateway.routes[7].uri=lb://progress-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/progress/**, /api/v1/certificates/**

spring.cloud.gateway.routes[8].id=notification-service
spring.cloud.gateway.routes[8].uri=lb://notification-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.routes[9].id=oauth2-login
spring.cloud.gateway.routes[9].uri=lb://auth-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/login/oauth2/**, /oauth2/**, /api/v1/auth/oauth2/**

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Aggregate microservices documentation
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/api/v1/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=Course Service
springdoc.swagger-ui.urls[1].url=/api/v1/courses/v3/api-docs
springdoc.swagger-ui.urls[2].name=Lesson Service
springdoc.swagger-ui.urls[2].url=/api/lessons/v3/api-docs
springdoc.swagger-ui.urls[3].name=Enrollment Service
springdoc.swagger-ui.urls[3].url=/api/enrollments/v3/api-docs
springdoc.swagger-ui.urls[4].name=Assessment Service
springdoc.swagger-ui.urls[4].url=/api/assessment/v3/api-docs
springdoc.swagger-ui.urls[5].name=Payment Service
springdoc.swagger-ui.urls[5].url=/api/payment/v3/api-docs
springdoc.swagger-ui.urls[6].name=Discussion Service
springdoc.swagger-ui.urls[6].url=/api/v1/discussion/v3/api-docs
springdoc.swagger-ui.urls[7].name=Progress Service
springdoc.swagger-ui.urls[7].url=/api/progress/v3/api-docs
springdoc.swagger-ui.urls[8].name=Notification Service
springdoc.swagger-ui.urls[8].url=/api/notifications/v3/api-docs

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
